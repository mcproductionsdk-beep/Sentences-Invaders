name: Sentence sharing backend tests
on:
  push:
    branches: [dev/sentence-sharing-v1]
  pull_request:
    paths:
      - 'backend/**'
      - 'package.json'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
