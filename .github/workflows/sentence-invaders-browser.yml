name: Sentence Invaders browser verification
on:
  push:
    branches: [fix/target-language-distractors]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/distractors.test.cjs
      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentence-invaders-browser-screenshots
          path: browser-screenshots/
          if-no-files-found: ignore
